services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build: ./keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  consumer-app:
    build: ./consumer-app
    environment:
      PORT: 4000
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: onclusive-poc
      KEYCLOAK_CLIENT_ID: webhook-consumer
      KEYCLOAK_CLIENT_SECRET: poc-webhook-consumer-secret
      WEBHOOK_SECRET: poc-shared-webhook-secret
      WEBHOOK_VERIFY: "true"
      DB_PATH: /data/consumer-app-db.json
    ports:
      - "4000:4000"
    volumes:
      - consumerdata:/data
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
  consumerdata:
